      - 'Kvalitativ forskning': 'Foundations/basic_discipline/Qualitative-Research-Tutorial-sv.md'
      - 'Kvantitativ forskning': 'Foundations/basic_discipline/Quantitative-Research-Tutorial-sv.md'
