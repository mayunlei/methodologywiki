site_name: "方法論の知恵ウィキ : 成功への道"
site_description: '強力な方法論を体系的に紹介、説明、適用することに専念する知識ベースで、人々の成功への道を支援します。'
site_author: 'methodologywiki'

site_url: https://methodologywiki.com/ja/
repo_url: https://github.com/mayunlei/methodologywiki

docs_dir: docs

theme:
  name: material
  font: false
  custom_dir: ../overrides
  language: ja
  favicon: ../favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

extra_css:
  - stylesheets/extra.css
extra:
  analytics:
    provider: google
    property: G-VQ6RTZVF1S
  alternate:
    - name: English
      link: /
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
    - name: Español
      link: /es/
      lang: es
    - name: 日本語
      link: /ja/
      lang: ja
    - name: 한국어
      link: /ko/
      lang: ko
    - name: Русский
      link: /ru/
      lang: ru
    - name: Français
      link: /fr/
      lang: fr
    - name: Deutsch
      link: /de/
      lang: de
    - name: Português
      link: /pt/
      lang: pt
    - name: Nederlands
      link: /nl/
      lang: nl
    - name: Tiếng Việt
      link: /vi/
      lang: vi
    - name: Svenska
      link: /sv/
      lang: sv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2:
      version: 10.0.2

nav:
  - 'ホーム': 'index.md'
  - '基礎':
    - '基礎学問':
      - '混合方法研究': 'Foundations/basic_discipline/Mixed-Methods-Research-Tutorial-ja.md'
      - '質的研究': 'Foundations/basic_discipline/Qualitative-Research-Tutorial-ja.md'
      - '量的研究': 'Foundations/basic_discipline/Quantitative-Research-Tutorial-ja.md'
    - '学習方法':
      - 'コーネル式ノート法': 'Foundations/learning_methods/Cornell-Note-Taking-Tutorial-ja.md'
      - 'ファインマン・テクニック': 'Foundations/learning_methods/Feynman-Technique-Tutorial-ja.md'
    - '論理的思考':
