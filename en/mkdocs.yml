# 英文版构建配置（由根 mkdocs.yml 派生）。
# 与 zh/ja/... 等语言同构：产物部署到 /en/，页面 URL 为 /en/<分类>/...，
# 与 canonical、sitemap 声明一致。根 mkdocs.yml 保留供本地预览，不再用于发布。
site_name: "Wisdom Wiki of Methodologies : Way To Success"
site_description: "A knowledge base dedicated to systematically introducing, explaining, and applying various powerful methodologies, helping people on their path to success."
site_author: "methodologywiki" # 您可以替换成您的名字

site_url: https://methodologywiki.com/en/

docs_dir: ../docs/en
repo_url: https://github.com/mayunlei/methodologywiki

theme:
  name: material
  font: false
  custom_dir: ../overrides
  language: en
  # logo: assets/logo.ico # 我们稍后可以添加一个logo
  favicon: ../favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-VQ6RTZVF1S
  alternate:
    - name: English
      link: /
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
    - name: Español
      link: /es/
      lang: es
    - name: 日本語
      link: /ja/
      lang: ja
    - name: 한국어
      link: /ko/
      lang: ko
    - name: Русский
      link: /ru/
      lang: ru
    - name: Français
      link: /fr/
      lang: fr
    - name: Deutsch
      link: /de/
      lang: de
    - name: Português
      link: /pt/
      lang: pt
    - name: Nederlands
      link: /nl/
      lang: nl
    - name: Tiếng Việt
      link: /vi/
      lang: vi
    - name: Svenska
      link: /sv/
      lang: sv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2:
      version: 10.0.2
  - rss:
      match_path: .*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
  - minify:
      minify_html: true

