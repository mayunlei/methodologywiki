  - 'Início': 'index.md'
  - 'Fundamentos':
    - 'Disciplinas Básicas':
      - 'Pesquisa de Métodos Mistos': 'Foundations/basic_discipline/Mixed-Methods-Research-Tutorial-pt.md'
      - 'Pesquisa Qualitativa': 'Foundations/basic_discipline/Qualitative-Research-Tutorial-pt.md'
      - 'Pesquisa Quantitativa': 'Foundations/basic_discipline/Quantitative-Research-Tutorial-pt.md'
    - 'Métodos de Aprendizagem':
